name: Release gateway CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Verify gateway contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -v
          python3 scripts/check_public_surface.py --root .
